apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: vuln-fix
spec:
  entrypoint: main
  arguments:
    parameters:
      # traceparent W3C da rodada (o scan gera; ao rodar este template sozinho, informe um)
      - name: traceparent
  automountServiceAccountToken: false
  executor:
    serviceAccountName: vuln-fixer-executor
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: tmp
      emptyDir: {}
    - name: maven-settings
      configMap:
        name: maven-settings
  # O laboratório não tem artifact repository: os passos trocam arquivos por este volume (/work), que o scan enche (repos, shas.json, events).
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
  templates:
    # Uma execução por rodada: lê os eventos do scan em /work e corrige todos os pacotes juntos.
    - name: main
      inputs:
        parameters:
          - name: traceparent
      steps:
        - - name: fix
            template: fix
            arguments:
              parameters:
                - name: traceparent
                  value: "{{inputs.parameters.traceparent}}"
        # Só o fix terminar com patch verificado (stdout `ready`) segue para o passo com credencial.
        - - name: publish
            template: publish
            when: "{{steps.fix.outputs.result}} == ready"
            arguments:
              parameters:
                - name: traceparent
                  value: "{{inputs.parameters.traceparent}}"
        - - name: notify
            template: notify
            when: "{{steps.fix.outputs.result}} == ready"
            arguments:
              parameters:
                - name: traceparent
                  value: "{{inputs.parameters.traceparent}}"
    # Sem credencial de escrita (o token do GitHub Packages é só de leitura). Rede só para Maven Central, base OSV, github.com (tags),
    # maven.pkg.github.com e o gateway de modelo: NetworkPolicy do cluster (não incluída aqui). Rodada de release: ver a docstring de steps/fix/fix.py.
    # N2: o adaptador do agent-step-images roda neste pod (N2_HOOK) e só fala com o gateway; o agente não recebe nenhum segredo do pod.
    # Sem retryStrategy: a única retentativa é a do mvn (rede do Maven Central); repetir a rodada inteira custa dezenas de minutos.
    - name: fix
      inputs:
        parameters:
          - name: traceparent
      container:
        image: ghcr.io/open-eda-labs/agent-workflows-steps:0.2.0
        command: [python, -m, steps.fix.fix]
        env:
          - name: TRACEPARENT
            value: "{{inputs.parameters.traceparent}}"
          # GitHub Packages exige token até para ler (workflows/maven-settings.yaml).
          - name: MAVEN_ARGS
            value: -s /etc/maven/settings.xml
          - name: GITHUB_PACKAGES_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-packages-read
                key: token
          - name: N2_HOOK
            value: /opt/n2/n2-adapter
          # Suposição: Service `litellm` no namespace `ai-gateway`, porta 4000 (ainda não existe no lab-infra; ADR-0006).
          - name: OPENAI_BASE_URL
            value: http://litellm.ai-gateway.svc:4000/v1
          - name: MODEL
            value: fix-n2
          # Chave virtual do LiteLLM para a rota fix-n2, criada à mão (sem valor no Git).
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: litellm-fix-n2
                key: key
        securityContext: &restricted
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: work
            mountPath: /work
          - name: maven-settings
            mountPath: /etc/maven
            readOnly: true
    # Único passo com credencial de escrita: token curto de GitHub App (contents e pull requests só nos repositórios alvo).
    - name: publish
      inputs:
        parameters:
          - name: traceparent
      container:
        image: ghcr.io/open-eda-labs/agent-workflows-steps:0.2.0
        command: [python, -m, steps.publish.publish]
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: vuln-fixer-github-app
                key: token
          # Exigidos pelo contrato em `level: N2`: o prompt do n2-adapter (prompts/n2-migration.v1.md) e o nome lógico da rota.
          - name: N2_PROMPT
            value: n2-migration.v1
          - name: N2_MODEL
            value: fix-n2
          - name: TRACEPARENT
            value: "{{inputs.parameters.traceparent}}"
        securityContext: *restricted
        volumeMounts: &mounts
          - name: tmp
            mountPath: /tmp
          - name: work
            mountPath: /work
    - name: notify
      inputs:
        parameters:
          - name: traceparent
      container:
        image: ghcr.io/open-eda-labs/agent-workflows-steps:0.2.0
        command: [python, -m, steps.notify.notify]
        env:
          - name: SLACK_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: slack-webhook
                key: url
          - name: TRACEPARENT
            value: "{{inputs.parameters.traceparent}}"
        securityContext: *restricted
        volumeMounts: *mounts
