name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    # Convenção da org: o lint mora no repositório .github.
    uses: open-eda-labs/.github/.github/workflows/lint.yml@main

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pendência: pinar por SHA de commit (D-40).
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      # A base é a imagem do harness (ADR-0007). Constrói do agent-step-images na branch de mesmo nome do PR (senão na main)
      # com a tag que o Dockerfile espera; o docker build usa a imagem local antes do registry.
      - name: Construir o harness (agent-step-images)
        env:
          B: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone -q --depth 1 --branch "$B" https://github.com/open-eda-labs/agent-step-images harness \
            || git clone -q --depth 1 https://github.com/open-eda-labs/agent-step-images harness
          docker build --tag ghcr.io/open-eda-labs/agent-step-images:0.1.0 harness
      # Só constrói (sem push): pega erro de Dockerfile, de apt e de pip antes de a tag existir.
      - name: docker build
        run: docker build --tag agent-workflows-steps:ci .
